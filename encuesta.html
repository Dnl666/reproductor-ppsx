:root{
  /* Fondos y preguntas: bloques planos del afiche */
  --purple:#531DA7; --purple-deep:#2E0F63; --coral:#FF4E5E; --mint:#00F0CD; --yellow:#F7C71F;
  /* Opciones: tarjetas sobre azul noche */
  --navy:#222A35; --navy-2:#2D3745; --navy-line:#7686A0; --ink:#171C24; --mute:#C6CDDA; --err:#FFA3AE;
  --teal:#18B0B5;   --teal-d:#204F57;
  --orange:#EE8216; --orange-d:#5B422C;
  --violet:#AC74DA; --violet-d:#44385E;
  --red:#F94D67;    --red-d:#5E3442;
  --r-panel:24px; --r-opt:16px; --r-ctl:12px;
  --f:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
body[data-tone=purple]{--bg:var(--purple);--on:#fff;--on-soft:rgba(255,255,255,.9);--num:var(--coral);--rule:rgba(255,255,255,.6);
  --track:rgba(255,255,255,.28);--fill:var(--mint);--btn:var(--mint);--btn-ink:var(--purple-deep);--i1:var(--mint);--i2:var(--coral);--i3:var(--yellow)}
body[data-tone=coral]{--bg:var(--coral);--on:#fff;--on-soft:var(--purple-deep);--num:var(--mint);--rule:rgba(255,255,255,.7);
  --track:rgba(46,15,99,.24);--fill:var(--purple);--btn:var(--purple);--btn-ink:#fff;--i1:var(--purple);--i2:var(--mint);--i3:var(--yellow)}
body[data-tone=mint]{--bg:var(--mint);--on:var(--purple);--on-soft:var(--purple-deep);--num:var(--coral);--rule:rgba(83,29,167,.5);
  --track:rgba(83,29,167,.22);--fill:var(--purple);--btn:var(--purple);--btn-ink:#fff;--i1:var(--purple);--i2:var(--coral);--i3:var(--yellow)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--on);font:400 1rem/1.5 var(--f);transition:background-color .4s ease}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.page{max-width:680px;margin:0 auto;padding:20px 16px 56px}

/* ── Bloque de afiche: número, ilustración, pregunta subrayada ── */
.brand{margin:0 0 14px;font-size:.875rem;font-weight:500;color:var(--on-soft)}
.hero-head{display:flex;align-items:flex-start;min-height:104px}
.hero-num{font-size:3.25rem;font-weight:800;line-height:.9;color:var(--num)}
.hero-art{width:164px;margin:-6px -4px -30px auto;flex:none}
.hero-art svg{display:block;width:100%;height:auto;overflow:visible}
.hero-title{position:relative;margin:0;max-width:16ch;font-size:clamp(2rem,8.6vw,2.75rem);font-weight:700;line-height:1.14;letter-spacing:-.01em;text-wrap:balance}
.hero-title:focus{outline:none}
.hero-title .u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.12em;text-decoration-color:var(--rule);text-decoration-skip-ink:none}
.hero-sub{margin:14px 0 0;max-width:44ch;font-size:1.0625rem;line-height:1.45;color:var(--on-soft)}
.hero-sub.is-small{max-width:52ch;font-size:.9375rem;line-height:1.5}
.hero-kicker{position:relative;margin:0 0 6px;font-size:.9375rem;font-weight:600;color:var(--on-soft)}
.hero{margin-bottom:24px}
.progress-row{display:flex;align-items:center;gap:12px;margin:22px 0 0}
.progress{flex:1;display:flex;gap:4px}
.progress i{flex:1;height:6px;border-radius:999px;background:var(--track);transition:background-color .3s}
.progress i.on{background:var(--fill)}
.progress-label{font-size:.875rem;font-weight:500;color:var(--on-soft);font-variant-numeric:tabular-nums;white-space:nowrap}

.note{margin:0 0 14px;padding:12px 16px;border-radius:var(--r-ctl);background:var(--yellow);color:var(--ink);font-size:.9375rem;font-weight:500}

/* ── Paneles azul noche ── */
.panel{margin:0;padding:22px 16px;border-radius:var(--r-panel);background:var(--navy);color:#fff}
.panel + .panel{margin-top:14px}
.panel h2{margin:0 0 18px;font-size:1.375rem;font-weight:700;line-height:1.2}
.panel h2:has(+ .panel-lead){margin-bottom:6px}
.panel-lead{margin:0 0 20px;color:var(--mute)}
fieldset{min-width:0;margin:0;padding:0;border:0}

.field{margin-bottom:24px}
.field:last-child{margin-bottom:0}
.field > label,.field > legend{display:block;margin-bottom:8px;padding:0;font-weight:600}
.field input[type=text],.field input[type=email]{width:100%;height:52px;padding:0 16px;border:2px solid var(--navy-line);border-radius:var(--r-ctl);
  background:var(--navy-2);color:#fff;font:inherit;caret-color:var(--mint)}
.field input[type=text]:focus-visible,.field input[type=email]:focus-visible{outline:3px solid rgba(0,240,205,.4);outline-offset:0;border-color:var(--mint)}
.field input[aria-invalid=true]{border-color:var(--err)}
.field input:-webkit-autofill{-webkit-text-fill-color:#fff;box-shadow:0 0 0 100px var(--navy-2) inset;caret-color:var(--mint)}
.field textarea{display:block;width:100%;min-height:168px;padding:14px 16px;border:2px solid var(--navy-line);border-radius:var(--r-ctl);
  background:var(--navy-2);color:#fff;font:inherit;line-height:1.5;caret-color:var(--mint);resize:vertical}
.field textarea:focus-visible{outline:3px solid rgba(0,240,205,.4);outline-offset:0;border-color:var(--mint)}
.field textarea[aria-invalid=true]{border-color:var(--err)}
.opt-tag{font-weight:400;color:var(--mute)}
.field-help{margin:-2px 0 10px;color:var(--mute);font-size:.9375rem}
.panel.open-q{margin-top:14px}
.open-q .field > label{font-weight:600;line-height:1.4;margin-bottom:12px}
.open-k{display:block;margin-bottom:4px;font-size:.9375rem;font-weight:700;color:var(--yellow)}
.count{margin:8px 0 0;font-size:.875rem;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}

/* ── Opciones: círculo con ícono, cabeza de color, base oscura con la marca ── */
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opts.is-roles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{position:relative;display:flex;flex-direction:column;padding-top:18px}
.opt input{position:absolute;inset:0;z-index:2;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.opt-face{position:relative;flex:1;display:flex;flex-direction:column;border-radius:var(--r-opt);background:var(--hue-d)}
.opt-ico{position:absolute;top:-18px;left:50%;width:36px;height:36px;margin-left:-18px;display:grid;place-items:center;border-radius:50%;
  background:var(--hue);box-shadow:0 5px 10px rgba(12,16,22,.4)}
.opt-ico svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.opt-top{flex:1;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:26px 6px 10px;border-radius:var(--r-opt);text-align:center;
  transition:background-color .15s}
.opt-label{font-size:clamp(.75rem,3.4vw,.9375rem);font-weight:700;line-height:1.15;color:#fff}

/* ═════════ 3. UTILIDADES ═════════ */

const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const SEND_TIMEOUT_MS = 15000;

const ITEMS = SECTIONS.flatMap((s, si) => s.classes.map((name, ci) => ({
  id: `s${si + 1}c${ci + 1}`, sectionIndex: si + 1, classIndex: ci + 1,
  section: `Sección ${si + 1} – ${s.title}`, name,
})));
const STRUCTURE = CFG.interactiveVersion + "|" + ITEMS.map(i => i.id).join(",");

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

// Solo recibe cadenas de ART e ICONS, definidas arriba en este archivo.
function svg(cls, inner, viewBox) {
  const el = h("span", { class: cls, "aria-hidden": "true" });
  el.innerHTML = `<svg viewBox="${viewBox}" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" focusable="false">${inner}</svg>`;
  return el;
}
const icon = (cls, name) => svg(cls, ICONS[name] || "", "0 0 24 24");

function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16);
  (window.crypto || window.msCrypto).getRandomValues(b);
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const x = [...b].map(n => n.toString(16).padStart(2, "0")).join("");
  return `${x.slice(0, 8)}-${x.slice(8, 12)}-${x.slice(12, 16)}-${x.slice(16, 20)}-${x.slice(20)}`;
}

const K = {
  state: `zq:${CFG.interactiveId}:state`,
  queue: `zq:${CFG.interactiveId}:queue`,
  done:  `zq:${CFG.interactiveId}:done`,
};
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k)    { try { localStorage.removeItem(k); } catch {} },
};

/* ═════════ 4. ESTADO ═════════ */

function freshState() {
  const answers = {};
  for (const it of ITEMS) answers[it.id] = { a: "", b: [], aAt: null, bAt: null, aN: 0, bN: 0 };
  return {
    structure: STRUCTURE, step: 0, submissionId: uuid(), startedAt: new Date().toISOString(),
    respondent: { company: "", role: "", jobTitle: "", email: "" }, answers, opens: {}, openAt: {}, done: false,
  };
}

function loadState() {
  const s = store.get(K.state, null);
  if (!s || s.structure !== STRUCTURE || s.done || !s.respondent || !s.answers) return freshState();
  const relOk = v => v === "" || RELEVANCIA.options.some(o => o.value === v);
  const enfOk = v => ENFOQUE.options.some(o => o.value === v);
  for (const it of ITEMS) {
    const a = s.answers[it.id];
    if (!a || !relOk(a.a) || !Array.isArray(a.b) || !a.b.every(enfOk)) return freshState();
  }
  if (!s.opens || typeof s.opens !== "object") s.opens = {};
  if (!s.openAt || typeof s.openAt !== "object") s.openAt = {};
  if (typeof s.respondent.jobTitle !== "string") s.respondent.jobTitle = "";
  s.step = Math.min(Math.max(0, s.step | 0), SECTIONS.length);
  return s;
}

let state = loadState();
const save = () => store.set(K.state, state);

}

function buildSection(sec, si) {
  const items = ITEMS.filter(it => it.sectionIndex === si + 1);
  const checks = [];

  const cards = items.map(it => {
    const a = state.answers[it.id];
    const eA = h("p", { class: "err", id: `e-${it.id}-a`, "aria-live": "polite" });
    const eB = h("p", { class: "err", id: `e-${it.id}-b`, "aria-live": "polite" });

    const radios = RELEVANCIA.options.map((o, i) => {
      const input = h("input", { type: "radio", name: `${it.id}_A`, value: o.value, id: `${it.id}-a${i}` });
      input.checked = a.a === o.value;
      input.addEventListener("change", () => {
        a.a = o.value; a.aN++; a.aAt = new Date().toISOString(); save(); setErr(eA); refresh();
      });
      return input;
    });
    const boxes = ENFOQUE.options.map((o, i) => {
      const input = h("input", { type: "radio", name: `${it.id}_B`, value: o.value, id: `${it.id}-b${i}` });
      input.checked = a.b.includes(o.value);
      input.addEventListener("change", () => {
        a.b = [o.value];   // se guarda como lista de un elemento: la hoja y el reporte no cambian
        a.bN++; a.bAt = new Date().toISOString(); save(); setErr(eB); refresh();
      });
      return input;
    });

    const card = h("article", { class: "panel item", id: it.id },
      h("h3", { class: "item-h" }, h("span", { class: "item-n", "aria-hidden": "true", text: String(it.classIndex) }), h("span", { class: "item-t", text: it.name })),
      h("fieldset", { class: "grp", "aria-describedby": eA.id },
        h("legend", {}, `${RELEVANCIA.key}. ${RELEVANCIA.title}`, h("span", { class: "sr-only", text: ` de ${it.name}` })),
        h("div", { class: "opts" }, RELEVANCIA.options.map((o, i) => optCard("radio", radios[i], o))),
        eA),
      h("fieldset", { class: "grp", "aria-describedby": eB.id },
        h("legend", {}, `${ENFOQUE.key}. ${ENFOQUE.title}`, h("span", { class: "sr-only", text: ` de ${it.name}` })),
        h("div", { class: "opts" }, ENFOQUE.options.map((o, i) => optCard("radio", boxes[i], o))),
        eB));

    function refresh() { setErr(summaryErr); if (a.a && a.b.length) card.classList.remove("has-error"); }
    checks.push(() => {
      let first = null;
      if (!a.a) { setErr(eA, "Elige una categoría."); first = radios[0]; }
      if (!a.b.length) { setErr(eB, "Elige un enfoque."); first = first || boxes[0]; }
      card.classList.toggle("has-error", !!first);
      return first;
    });
    return card;
  });

  const open = buildOpen(si);
  const node = h("section", { class: "screen", "data-screen": `s${si + 1}`, "aria-labelledby": "hero-title", hidden: true }, buildGuide(si === 0), cards, open.node);

  function validate() {
    const bad = checks.map(fn => fn()).filter(Boolean);
    const n = bad.length;
    const openBad = open.check();
    if (!n && openBad) return { focus: openBad, message: "Falta responder la pregunta abierta de esta sección." };
    return { focus: bad[0] || null, message: n ? (n === 1 ? "Falta responder 1 clase de esta sección." : `Faltan respuestas en ${n} clases de esta sección.`) : "" };
  }
  const hero = { num: String(si + 1), art: sec.art, kicker: `Módulo ${sec.module} de ${MODULES.length}`, kickerSr: `Sección ${si + 1} de ${SECTIONS.length}`,
    title: sec.title, sub: MODULES[sec.module - 1], small: true };
  return { node, hero, validate };
}

function buildOpen(si) {

  const sync = () => { count.textContent = `${field.value.length} de ${OPEN.maxLength} caracteres`; };
  field.addEventListener("input", () => {
    state.opens[key] = field.value; state.openAt[key] = new Date().toISOString(); save(); setErr(err); setErr(summaryErr); field.removeAttribute("aria-invalid"); sync();
  });
  sync();
  const node = h("div", { class: "panel open-q" },
    h("div", { class: "field" },

    return null;

const $ = id => document.getElementById(id);
const heroTitle = $("hero-title");

function show(step, focus) {
  state.step = step; save();
  screens.forEach((s, i) => { s.node.hidden = i !== step; });
  fin.node.hidden = true; nav.hidden = false; progressRow.hidden = false;
  setErr(summaryErr);
  setHero(TONES[step % TONES.length], screens[step].hero, step > 0);
  btnBack.hidden = step === 0;
  btnNext.disabled = false;
  btnNext.textContent = step === TOTAL - 1 ? "Enviar respuestas" : "Continuar";
  progress.setAttribute("aria-valuemax", String(TOTAL));
  progress.setAttribute("aria-valuenow", String(step + 1));
  progress.setAttribute("aria-valuetext", `Paso ${step + 1} de ${TOTAL}`);
  [...progress.children].forEach((seg, i) => seg.classList.toggle("on", i <= step));
  progressLabel.textContent = `Paso ${step + 1} de ${TOTAL}`;
  if (focus) { window.scrollTo(0, 0); heroTitle.focus({ preventScroll: true }); }
}

let busy = false;
async function next() {
  if (busy) return;
  const res = screens[state.step].validate();
  if (res.focus) {
    setErr(summaryErr, res.message);
    res.focus.focus();
    res.focus.scrollIntoView({ block: "center", behavior: "auto" });
    return;
  }
  if (state.step < TOTAL - 1) { show(state.step + 1, true); return; }
  await submit();
}

form.addEventListener("submit", e => { e.preventDefault(); next(); });
btnBack.addEventListener("click", () => { if (!busy && state.step > 0) show(state.step - 1, true); });

/* ═════════ 7. ENVÍO ═════════ */

function buildPayload() {
  const completedAt = new Date();
  const iso = completedAt.toISOString();
  const r = state.respondent;
  const role = ROLES.find(x => x.value === r.role);
  const relLabel = v => (RELEVANCIA.options.find(o => o.value === v) || {}).label || "";
  const enfLabel = v => (ENFOQUE.options.find(o => o.value === v) || {}).label || "";
  const answers = [], flat = {}, items = [];
  let index = 0;

  for (const it of ITEMS) {
    const a = state.answers[it.id];
    const bLabels = a.b.map(enfLabel);
    answers.push({ questionId: `${it.id}_A`, index: ++index, type: "single_choice", prompt: `${RELEVANCIA.key}. ${RELEVANCIA.title}`,
      section: it.section, item: it.name, value: a.a, label: relLabel(a.a), answeredAt: a.aAt || iso, changed: Math.max(0, a.aN - 1) });
    answers.push({ questionId: `${it.id}_B`, index: ++index, type: "single_choice", prompt: `${ENFOQUE.key}. ${ENFOQUE.title}`,
      section: it.section, item: it.name, value: a.b.slice(), label: bLabels, answeredAt: a.bAt || iso, changed: Math.max(0, a.bN - 1) });
    flat[`${it.id}_A`] = relLabel(a.a);
    flat[`${it.id}_B`] = bLabels.join(" | ");
    items.push({ id: it.id, sectionIndex: it.sectionIndex, section: it.section, classIndex: it.classIndex, name: it.name,
      relevancia: a.a, relevanciaLabel: relLabel(a.a), enfoque: a.b.slice(), enfoqueLabels: bLabels });
  }

  const openAnswers = SECTIONS.map((sec, si) => {
    const key = `s${si + 1}`;
    const value = (state.opens[key] || "").trim().slice(0, OPEN.maxLength);
    answers.push({ questionId: `${key}_${OPEN.id}`, index: ++index, type: "open_text", prompt: OPEN.prompt,
      section: `Sección ${si + 1} – ${sec.title}`, value, answeredAt: state.openAt[key] || iso });
    flat[`${key}_${OPEN.id}`] = value;
    return { sectionIndex: si + 1, section: `Sección ${si + 1} – ${sec.title}`, prompt: OPEN.prompt, value };
  });

  const utm = {};
  try { new URLSearchParams(location.search).forEach((v, k) => { if (k.startsWith("utm_")) utm[k] = v.slice(0, 120); }); } catch {}

  return {
    schemaVersion: "1.0",
    interactiveId: CFG.interactiveId,
    interactiveVersion: CFG.interactiveVersion,
    submissionId: state.submissionId,
    event: "submit",
    startedAt: state.startedAt,
    completedAt: iso,
    durationMs: Math.max(0, completedAt - new Date(state.startedAt)),
    locale: CFG.locale,
    respondent: { email: r.email.trim().toLowerCase(), name: null, externalId: null,
      company: r.company.trim(), role: r.role, roleLabel: role ? role.label : "", jobTitle: r.jobTitle.trim() },
    context: { utm, referrer: document.referrer || "", userAgent: navigator.userAgent, viewport: `${innerWidth}x${innerHeight}` },
    answers, answersFlat: flat, items,
    openAnswers,
  };
}

function fetchT(url, init) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), SEND_TIMEOUT_MS);
  return fetch(url, { ...init, signal: ctl.signal }).finally(() => clearTimeout(t));
}

// text/plain evita el preflight CORS. Solo cuenta como enviado si el destino lo confirma;
// con opaqueFallback se reenvía sin confirmación (el destino descarta duplicados por submissionId).
async function post(payload) {
  const init = { method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" }, body: JSON.stringify(payload), keepalive: true };
  let res;
  try { res = await fetchT(CFG.endpoint, init); }
  catch (err) {
    if (!CFG.opaqueFallback) throw err;
    await fetchT(CFG.endpoint, { ...init, mode: "no-cors" }); return;
  }
  if (!res.ok) throw new Error("HTTP " + res.status);
  let data = null;
  try { data = await res.json(); } catch {}
  if (data && data.ok === false) throw new Error(data.error || "rechazado");
}

const readQ  = () => { const q = store.get(K.queue, []); return Array.isArray(q) ? q : []; };
const writeQ = q => store.set(K.queue, q.slice(-20));

let flushing = null;
function flush() {
  if (!CFG.endpoint) return Promise.resolve(false);
  if (flushing) return flushing;
  flushing = (async () => {
    let q = readQ();
    while (q.length) {
      try { await post(q[0]); } catch { return false; }
      q = readQ(); q.shift(); writeQ(q);
    }
    return true;
  })().finally(() => { flushing = null; });
  return flushing;
}

async function submit() {
  busy = true;
  btnNext.disabled = true; btnNext.textContent = "Enviando…";
  const payload = buildPayload();
  state.done = true; save();
  if (!CFG.allowRestart) store.set(K.done, true);
  let status = "test";
  if (CFG.endpoint) {
    const q = readQ(); q.push(payload); writeQ(q);
    status = (await flush()) ? "sent" : "pending";
  }
  busy = false;
  showFin(status, payload);
}

function showFin(status, payload) {
  screens.forEach(s => { s.node.hidden = true; });
  nav.hidden = true; progressRow.hidden = true; setErr(summaryErr);
  fin.node.hidden = false;
  fin.body.textContent = "";

  if (status === "pending") {
    setHero("purple", { num: "", art: "pendiente", kicker: "", title: "Tus respuestas quedaron guardadas", sub: "" }, true);
    const msg = h("p", { "aria-live": "polite", text: "No fue posible enviarlas en este momento. Están guardadas en este dispositivo y se enviarán solas cuando vuelva la conexión." });
    const retry = h("button", { type: "button", class: "btn btn-primary", id: "btn-retry", text: "Reintentar ahora" });
    retry.addEventListener("click", async () => {
      retry.disabled = true; retry.textContent = "Enviando…";
      if (await flush()) showFin("sent", payload);
      else { retry.disabled = false; retry.textContent = "Reintentar ahora"; msg.textContent = "Todavía no hay conexión. Tus respuestas siguen guardadas en este dispositivo."; }
    });
    fin.body.append(msg, h("div", { class: "nav" }, retry));
    fin.pendingPayload = payload;
  } else {
    fin.pendingPayload = null;
    setHero("purple", { num: "", art: "fin", kicker: "", title: "Gracias", sub: "" }, true);
    fin.body.append(h("p", { text: status === "sent" ? "Tus respuestas quedaron registradas." : "Recorrido completo." }));
    if (status === "test") {
      fin.body.append(
        h("p", { class: "note", text: "Modo prueba: no se envió nada. Esto es lo que llegaría a la hoja:" }),
        h("pre", { id: "payload-preview", tabindex: "0", text: JSON.stringify(payload, null, 2) }));
    }
    if (CFG.allowRestart) {
      const again = h("button", { type: "button", class: "btn btn-ghost", id: "btn-restart", text: "Responder de nuevo" });
      again.addEventListener("click", start);
      fin.body.append(h("div", { class: "nav" }, again));
    }
  }
  window.scrollTo(0, 0);
  heroTitle.focus({ preventScroll: true });
}

addEventListener("online", async () => {
  const ok = await flush();
  if (ok && fin.pendingPayload && !fin.node.hidden) showFin("sent", fin.pendingPayload);
});
addEventListener("pagehide", () => {
  if (!CFG.endpoint || !navigator.sendBeacon) return;
  for (const p of readQ()) navigator.sendBeacon(CFG.endpoint, new Blob([JSON.stringify(p)], { type: "text/plain;charset=UTF-8" }));
});

/* ═════════ 8. ARRANQUE ═════════ */

function start() {
  state = freshState(); save();
  buildAll();
  show(0, true);
}

document.title = CFG.title;
$("test-note").hidden = !!CFG.endpoint;

if (!CFG.allowRestart && store.get(K.done, false)) {
  buildAll();
  showFin("sent", null);
} else {
  buildAll();
  show(state.step, false);
}
flush();
})();
</script>
